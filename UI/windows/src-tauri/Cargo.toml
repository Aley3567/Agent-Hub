[package]
name = "claude1-desktop"
version = "0.1.0"
description = "claude1 Windows 桌面端：多渠道 / 多模型状态的只读遥控器"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
# Tauri v2 惯例：lib 供移动端与集成测试复用，bin 只是薄壳
name = "claude1_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 不开 macos-private-api：那是 macOS 侧 vibrancy 用的。Windows 的 Mica 由
# tauri.conf.json 的 windowEffects 声明，tauri 自带能力，不需要额外 feature。
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# CC Switch 数据库只读打开；bundled 避免依赖系统 libsqlite3 版本
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = "symbols"

# 仓库根另有 Rust workspace（crates/agent-hub），本工程是独立 Tauri 项目，
# 空 [workspace] 表阻止 cargo 向上认亲
[workspace]
