<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent-Hub 设计地图</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f7f4;color:#262b2b;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{padding:22px 28px;border-bottom:1px solid #dfe2dc;display:flex;align-items:center;gap:18px}h1{font-size:22px;margin:0}header p{margin:6px 0;color:#68716a;font-size:12px}.tools{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}button,select,input,textarea{font:inherit;border:1px solid #d8ddd6;border-radius:7px;background:white;color:inherit;padding:8px}button{cursor:pointer}button:hover{background:#edf2eb}main{display:grid;grid-template-columns:minmax(450px,1fr) 360px;height:calc(100vh - 103px)}#map{padding:32px;overflow:auto}ul{list-style:none;padding-left:28px;margin:8px 0;border-left:1px solid #cfd7cc}li{position:relative;margin:12px 0}li:before{content:'';position:absolute;left:-28px;top:18px;width:27px;border-top:1px solid #cfd7cc}.node{display:inline-flex;align-items:center;gap:9px;max-width:600px;padding:10px 13px;background:#fff;border:1px solid #dce2d8;border-radius:8px;text-align:left}.node.active{border-color:#396244;background:#eef4ec}.tag{font-size:11px;color:#627160;white-space:nowrap}.fold{border:0;background:transparent;padding:2px 6px}aside{border-left:1px solid #dfe2dc;padding:26px;background:#fff;overflow:auto}label{display:block;margin:20px 0 8px;color:#64705f;font-size:12px}input,textarea,select{width:100%}textarea{height:200px;resize:vertical;line-height:1.7}#path{font-size:12px;color:#74806e;line-height:1.8}#notice{font-size:12px;color:#55734c;line-height:1.7;margin-top:18px}.primary{background:#365a3d;color:white;margin-top:18px}small{display:block;color:#788171;line-height:1.8;margin-top:18px}@media(max-width:850px){main{display:block;height:auto}aside{border-top:1px solid #ddd}header{display:block}.tools{margin-top:12px}#map{max-height:65vh}}
</style><header><div><h1>Agent-Hub / 设计地图</h1><p>从使用体验出发 · 共识 / 建议 / 问题 / 验证 · 讨论草案，不代表已实现</p></div><div class="tools"><button id="expand">全部展开</button><button id="collapse">收起支线</button><button id="export">导出备份</button><button id="import">载入备份</button><input id="file" type="file" accept="application/json" hidden></div></header><main><section id="map" aria-label="设计树"></section><aside><div id="path"></div><label for="title">节点名称</label><input id="title"><label for="status">讨论状态</label><select id="status"><option>共识</option><option>建议</option><option>问题</option><option>验证</option></select><label for="note">思考、理由与问题</label><textarea id="note"></textarea><button id="save" class="primary">保存节点</button> <button id="add">追加子节点</button><div id="notice" role="status"></div><small>编辑保存在当前浏览器。跨浏览器、清理缓存或交给后续对话维护前，请导出 JSON 备份。网页编辑不会自动写回仓库。<br>可继续在对话中说：“在模型选择下面加一个问题……”由助手更新仓库版本。</small></aside></main><script>
const initial={"id": "Agent-Hub 设计地图", "title": "Agent-Hub 设计地图", "status": "共识", "note": "围绕真实使用体验持续讨论。来源：2026-09-10 本次对话及分享讨论。共识表示方向获认可，不表示功能已实现；建议尚未逐项确认；问题尚待讨论；验证需要运行证据。这里是设计讨论，不是开发任务队列。", "children": [{"id": "产品定位与边界", "title": "产品定位与边界", "status": "共识", "note": "统一本地工作台 + 可独立使用的多模型网关。", "children": [{"id": "Workspace 与 Gateway 两种入口", "title": "Workspace 与 Gateway 两种入口", "status": "共识", "note": "用户可以在 Hub 工作，也可以继续使用原生客户端，只接入网关。", "children": []}, {"id": "原生 Harness 持有会话", "title": "原生 Harness 持有会话", "status": "共识", "note": "上下文、工具、权限与持久化归原生 Harness。离开 Hub 后仍可恢复原生会话。", "children": []}, {"id": "首版服务哪条完整流程？", "title": "首版服务哪条完整流程？", "status": "问题", "note": "建议先打通发现旧会话 → 继续工作 → 回到原生客户端 → 再回 Hub。首个 Harness 尚未决定。", "children": []}]}, {"id": "项目与会话", "title": "项目与会话", "status": "共识", "note": "支持新建、继续旧会话，并减少重复操作。", "children": [{"id": "新建会话", "title": "新建会话", "status": "共识", "note": "选择项目、Harness 和模型后开始聊天。", "children": []}, {"id": "默认发现旧会话", "title": "默认发现旧会话", "status": "建议", "note": "自动索引可发现的原生历史；不复制成 Hub 独有的会话。其他设备或目录使用单独导入入口。", "children": []}, {"id": "保留旧会话模型", "title": "保留旧会话模型", "status": "共识", "note": "打开旧会话应沿用此前模型，无需每次手动切换。", "children": []}, {"id": "原渠道缺失时怎么恢复？", "title": "原渠道缺失时怎么恢复？", "status": "问题", "note": "原生记录可能只有模型而无 Provider。如何一次选择后记住？", "children": []}, {"id": "会话交接与并发控制", "title": "会话交接与并发控制", "status": "验证", "note": "运行中原生客户端与 Hub 的控制权如何交接？退出 Hub 后任务如何继续？", "children": []}, {"id": "跨 Harness 接续", "title": "跨 Harness 接续", "status": "建议", "note": "创建目标 Harness 的原生会话并交接允许传递的上下文，保留来源关系。不是直接改会话引擎。", "children": []}]}, {"id": "模型选择与默认值", "title": "模型选择与默认值", "status": "问题", "note": "目标：用户打开对话就能可靠继续，清楚请求实际发给谁。", "children": [{"id": "新会话默认优先级", "title": "新会话默认优先级", "status": "建议", "note": "项目默认优先于全局默认；修改全局默认只影响以后新建的会话。", "children": []}, {"id": "记住选择而非临时 fallback", "title": "记住选择而非临时 fallback", "status": "建议", "note": "保存用户选定的模型和路由；一次故障切换不应永久改掉偏好。", "children": []}, {"id": "执行结束后应用模型切换", "title": "执行结束后应用模型切换", "status": "建议", "note": "首版在当前执行完成后生效；历史记录当时实际执行模型。", "children": []}, {"id": "KV cache 与上下文", "title": "KV cache 与上下文", "status": "验证", "note": "缓存失效不等于历史丢失。需要验证长会话压缩、上下文窗口、工具历史、图片与推理内容的兼容性。", "children": []}, {"id": "切换兼容性矩阵", "title": "切换兼容性矩阵", "status": "验证", "note": "分别验证同 Harness 换模型、同模型换渠道、跨模型家族和跨 Harness 交接。", "children": []}]}, {"id": "Provider 与多模型网关", "title": "Provider 与多模型网关", "status": "问题", "note": "让偏好固定渠道的用户安心，也支持多渠道路由。", "children": [{"id": "保留同一 Provider 偏好", "title": "保留同一 Provider 偏好", "status": "共识", "note": "用户可能长期偏好一个 Provider；换模型时不应制造重复选择负担。", "children": []}, {"id": "固定 / 优先 / 自动路由", "title": "固定 / 优先 / 自动路由", "status": "建议", "note": "仅使用指定渠道；优先指定渠道并使用备用；或按方案选择。三者应明确区分。", "children": []}, {"id": "自定义渠道流程", "title": "自定义渠道流程", "status": "建议", "note": "填写名称、地址、凭证与协议 → 发现或手填模型 → 可选备用渠道。", "children": []}, {"id": "模型映射与备用顺序", "title": "模型映射与备用顺序", "status": "建议", "note": "展示模型、默认渠道、备用渠道；真实模型 ID 可展开编辑。", "children": []}, {"id": "Profile 路由方案", "title": "Profile 路由方案", "status": "建议", "note": "一套配置即可开始；需要多套时复制方案。", "children": []}, {"id": "会话是否跟随方案修改？", "title": "会话是否跟随方案修改？", "status": "问题", "note": "固定模型渠道与跟随命名方案应如何呈现？尚未定案。", "children": []}, {"id": "故障与费用反馈", "title": "故障与费用反馈", "status": "问题", "note": "如何说明实际渠道、切换原因和费用变化，同时保持日常界面安静？", "children": []}]}, {"id": "工作台与前端体验", "title": "工作台与前端体验", "status": "共识", "note": "借鉴 Codex 的信息层级、留白与按需展示。", "children": [{"id": "项目与会话导航", "title": "项目与会话导航", "status": "建议", "note": "左侧围绕工作组织，Harness 是会话属性。", "children": []}, {"id": "当前任务占据主区域", "title": "当前任务占据主区域", "status": "共识", "note": "对话与当前工作为中心；工具、Diff、路由按需展开。", "children": []}, {"id": "输入区高频操作", "title": "输入区高频操作", "status": "建议", "note": "集中展示 Harness、模型、渠道及发送；避免频繁离开聊天做设置。", "children": []}, {"id": "设置与接入", "title": "设置与接入", "status": "建议", "note": "以语义明确的设置项组织；网关接入可查看变更并恢复。", "children": []}, {"id": "Desktop / TUI / CLI", "title": "Desktop / TUI / CLI", "status": "建议", "note": "Desktop 日常工作，TUI 终端场景，CLI 自动化；Electron + React 是倾向，尚非技术定案。", "children": []}]}, {"id": "核心架构与状态", "title": "核心架构与状态", "status": "问题", "note": "以下是目标设计议题，不替代当前仓库架构约束。", "children": [{"id": "Native Harness Adapter", "title": "Native Harness Adapter", "status": "建议", "note": "统一发现、启动、恢复、发送、中断和交接；如实表达不同 Harness 的能力差异。", "children": []}, {"id": "SessionRef 与索引", "title": "SessionRef 与索引", "status": "建议", "note": "backend + native_id；Hub 索引可重建，不能成为会话唯一真相源。", "children": []}, {"id": "UI 与后台通信", "title": "UI 与后台通信", "status": "问题", "note": "事件流、断线恢复、进程生命周期和状态归属怎样定义？", "children": []}, {"id": "网关与协议所有权", "title": "网关与协议所有权", "status": "问题", "note": "复用现有网关边界；具体改动前对照仓库事实与规范。", "children": []}, {"id": "可逆接入与凭证", "title": "可逆接入与凭证", "status": "建议", "note": "最小配置变更、验证与恢复；凭证不进入设计地图和日志。", "children": []}]}, {"id": "验证与反馈循环", "title": "验证与反馈循环", "status": "建议", "note": "围绕真实体验积累证据，发现摩擦后修正对应设计节点。", "children": [{"id": "最小端到端实验", "title": "最小端到端实验", "status": "验证", "note": "有工具调用的旧会话 → 换模型 → 继续 → 原生恢复。", "children": []}, {"id": "反馈记录方式", "title": "反馈记录方式", "status": "建议", "note": "记录场景、预期、实际、频率与影响；关联到具体设计节点。", "children": []}, {"id": "共识形成与变更", "title": "共识形成与变更", "status": "建议", "note": "每次讨论后更新节点；保留理由。形成实施工作时转入仓库正式队列。", "children": []}, {"id": "下一轮优先讨论", "title": "下一轮优先讨论", "status": "问题", "note": "旧会话恢复与模型默认值，适合作为第一条细化支线。", "children": []}]}]};const key='agenthub-design-map-v1';let tree=initial,selected,closed=new Set();const $=id=>document.getElementById(id);function valid(n,seen=new Set(),depth=0){if(depth>30||!n||typeof n.id!=='string'||seen.has(n.id)||typeof n.title!=='string'||typeof n.note!=='string'||!['共识','建议','问题','验证'].includes(n.status)||!Array.isArray(n.children))return false;seen.add(n.id);return n.children.every(x=>valid(x,seen,depth+1))}try{let s=JSON.parse(localStorage.getItem(key));if(valid(s))tree=s}catch{}function persist(){try{localStorage.setItem(key,JSON.stringify(tree));$('notice').textContent='已保存在当前浏览器；导出备份可长期保留。'}catch{$('notice').textContent='浏览器保存不可用，请立即导出备份。'}}function find(id,n=tree,path=[]){if(n.id===id)return {n,path:[...path,n.title]};for(const c of n.children){const r=find(id,c,[...path,n.title]);if(r)return r}}function choose(id){selected=id;const r=find(id);$('path').textContent=r.path.join(' / ');$('title').value=r.n.title;$('status').value=r.n.status;$('note').value=r.n.note;draw()}function draw(){const host=$('map');host.replaceChildren();function render(n,parent){const li=document.createElement('li');const row=document.createElement('div');if(n.children.length){const f=document.createElement('button');f.className='fold';f.textContent=closed.has(n.id)?'+':'−';f.setAttribute('aria-label','展开或收起 '+n.title);f.onclick=()=>{closed.has(n.id)?closed.delete(n.id):closed.add(n.id);draw()};row.append(f)}const b=document.createElement('button');b.className='node'+(n.id===selected?' active':'');b.textContent=n.title;const tag=document.createElement('span');tag.className='tag';tag.textContent=n.status;b.append(tag);b.onclick=()=>choose(n.id);row.append(b);li.append(row);if(n.children.length&&!closed.has(n.id)){const ul=document.createElement('ul');n.children.forEach(c=>render(c,ul));li.append(ul)}parent.append(li)}const root=document.createElement('ul');root.style.border='0';render(tree,root);host.append(root)}$('save').onclick=()=>{if(!$('title').value.trim())return;const n=find(selected).n;n.title=$('title').value.trim();n.status=$('status').value;n.note=$('note').value;persist();choose(n.id)};$('add').onclick=()=>{const n=find(selected).n;const child={id:'node-'+Date.now()+'-'+Math.random().toString(36).slice(2),title:'新的思考',status:'问题',note:'',children:[]};n.children.push(child);closed.delete(n.id);persist();choose(child.id);$('title').focus();$('title').select()};$('expand').onclick=()=>{closed.clear();draw()};$('collapse').onclick=()=>{closed=new Set(tree.children.map(c=>c.id));draw()};$('export').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(tree,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='agent-hub-design-map.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{try{const file=e.target.files[0];if(!file)return;const next=JSON.parse(await file.text());if(!valid(next))throw Error('invalid');if(!confirm('用备份替换当前浏览器中的地图？请先导出尚未备份的修改。'))return;tree=next;closed.clear();persist();choose(tree.id)}catch{$('notice').textContent='无法读取备份，请选择有效的设计地图 JSON。'}finally{e.target.value=''}};choose(tree.id);
</script></html>
