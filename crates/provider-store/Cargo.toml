[package]
name = "provider-store"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Hub-owned provider storage and explicit source imports"
publish = false

[dependencies]
anyhow = "1"
dirs = "6"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
same-file = "1"
