[package]
name = "agent-hub"
version = "0.2.0"
edition.workspace = true
license.workspace = true
description = "Agent-Hub：统一渠道管理（TUI + CLI 双模式），Hub 自有渠道存储"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
dirs = "6"
ratatui = "0.30"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
provider-store = { path = "../provider-store" }
