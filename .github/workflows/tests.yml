name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos-package:
    name: macOS desktop and release kit
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: UI/macos/package-lock.json
      - name: Set up Rust
        run: rustup toolchain install 1.96.0 --profile minimal && rustup default 1.96.0
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            UI/macos/src-tauri/target
          key: macos-arm64-rust-1.96-${{ hashFiles('Cargo.lock', 'UI/macos/src-tauri/Cargo.lock') }}
      - name: Test management plane and shared provider store
        run: cargo test --workspace --locked
      - name: Install desktop dependencies
        working-directory: UI/macos
        run: npm ci --no-audit --no-fund
      - name: Check desktop types
        working-directory: UI/macos
        run: npm run typecheck
      - name: Test desktop backend
        working-directory: UI/macos/src-tauri
        run: cargo test --locked
      - name: Build CLI
        run: cargo build --release --locked
      - name: Build desktop application
        working-directory: UI/macos
        run: npm run build -- --bundles app
      - name: Assemble versioned release kit
        run: python3 scripts/package-agent-hub-macos.py
      - name: Build double-click installer
        run: python3 scripts/package-agent-hub-macos-pkg.py --kit dist/Agent-Hub-*-macOS-arm64 --output-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: macOS-arm64-release-kit
          path: |
            dist/*.pkg
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependency
        # 与 claude-hub.py 的 PEP 723 内联声明保持一致(漏装 certifi 曾使
        # test_claude_hub/test_routes 在 CI 全矩阵 ImportError)
        run: python -m pip install "aiohttp>=3.9" "certifi>=2024.2.2"

      - name: Install zsh on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes zsh

      - name: Check Python syntax
        run: >-
          python -m py_compile
          claude-provider-once.py
          claude-hub.py
          claude1_protocol.py
          scripts/secret_guard.py

      - name: Install ruff
        run: python -m pip install "ruff==0.16.7"

      - name: Lint for undefined names and duplicate definitions
        # 规则集在 pyproject.toml 的 [tool.ruff.lint] 里,只查真实缺陷不查风格。
        run: ruff check --output-format github .

      - name: Scan repository for generic secrets and sensitive paths
        run: >-
          python scripts/secret_guard.py
          --working-tree
          --no-private-sources

      - name: Run Python tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run shell integration tests
        run: |
          sh -n install.sh
          zsh -n scripts/zsh-functions.sh scripts/zsh-sticky-integration.sh tests/test_shell_integration.zsh tests/test_install.zsh
          ./tests/test_shell_integration.zsh
          ./tests/test_install.zsh
